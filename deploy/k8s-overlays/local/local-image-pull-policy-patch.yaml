apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelmate-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelmate-frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          imagePullPolicy: IfNotPresent
