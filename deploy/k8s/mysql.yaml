apiVersion: v1
kind: Service
metadata:
  name: travelmate-mysql
  labels:
    app.kubernetes.io/name: travelmate-mysql
    app.kubernetes.io/part-of: travelmate
spec:
  selector:
    app.kubernetes.io/name: travelmate-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: travelmate-mysql
  labels:
    app.kubernetes.io/name: travelmate-mysql
    app.kubernetes.io/part-of: travelmate
spec:
  serviceName: travelmate-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travelmate-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: travelmate-mysql
        app.kubernetes.io/part-of: travelmate
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: travelmate
            - name: MYSQL_USER
              value: travelmate
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelmate-secrets
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelmate-secrets
                  key: mysql-root-password
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: mysql-init
          configMap:
            name: travelmate-mysql-init
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
        labels:
          app.kubernetes.io/name: travelmate-mysql
          app.kubernetes.io/part-of: travelmate
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
