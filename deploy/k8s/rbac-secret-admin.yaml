apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-admin
  namespace: travelmate
  labels:
    app.kubernetes.io/part-of: travelmate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-admin
  namespace: travelmate
  labels:
    app.kubernetes.io/part-of: travelmate
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["travelmate-secrets"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["travelmate-config"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["travelmate-backend"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-admin
  namespace: travelmate
  labels:
    app.kubernetes.io/part-of: travelmate
subjects:
  - kind: ServiceAccount
    name: secret-admin
    namespace: travelmate
roleRef:
  kind: Role
  name: secret-admin
  apiGroup: rbac.authorization.k8s.io
