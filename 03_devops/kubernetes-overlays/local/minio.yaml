apiVersion: v1
kind: Service
metadata:
  name: travelmate-minio
  labels:
    app.kubernetes.io/name: travelmate-minio
    app.kubernetes.io/part-of: travelmate
spec:
  selector:
    app.kubernetes.io/name: travelmate-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: travelmate-minio-public
  labels:
    app.kubernetes.io/name: travelmate-minio
    app.kubernetes.io/part-of: travelmate
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: travelmate-minio
  ports:
    - name: api
      port: 30900
      targetPort: api
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: travelmate-minio
  labels:
    app.kubernetes.io/name: travelmate-minio
    app.kubernetes.io/part-of: travelmate
spec:
  serviceName: travelmate-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travelmate-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: travelmate-minio
        app.kubernetes.io/part-of: travelmate
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: travelmate-secrets
                  key: s3-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelmate-secrets
                  key: s3-secret-key
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
        labels:
          app.kubernetes.io/name: travelmate-minio
          app.kubernetes.io/part-of: travelmate
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: travelmate-minio-init
  labels:
    app.kubernetes.io/name: travelmate-minio-init
    app.kubernetes.io/part-of: travelmate
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: travelmate-minio-init
        app.kubernetes.io/part-of: travelmate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: travelmate-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: travelmate-secrets
                  key: s3-secret-key
          command:
            - /bin/sh
            - -ec
            - |
              until mc --config-dir /tmp/.mc alias set local http://travelmate-minio:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do sleep 2; done
              mc --config-dir /tmp/.mc mb --ignore-existing local/travelmate
              mc --config-dir /tmp/.mc anonymous set download local/travelmate
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
