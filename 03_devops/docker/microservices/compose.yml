name: travelmate-microservices

services:
  identity-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: travelmate_identity
      MYSQL_USER: travelmate_identity_app
      MYSQL_PASSWORD: ${IDENTITY_DB_PASSWORD}
    ports:
      - "${IDENTITY_MYSQL_PORT:-3307}:3306"
    volumes:
      - identity-db-data:/var/lib/mysql
      - ./sql/identity-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./sql/identity-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  traffic-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: travelmate_traffic
      MYSQL_USER: travelmate_traffic_app
      MYSQL_PASSWORD: ${TRAFFIC_DB_PASSWORD}
    ports:
      - "${TRAFFIC_MYSQL_PORT:-3308}:3306"
    volumes:
      - traffic-db-data:/var/lib/mysql
      - ./sql/traffic-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./sql/traffic-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  local-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: travelmate_local
      MYSQL_USER: travelmate_local_app
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD}
    ports:
      - "${LOCAL_MYSQL_PORT:-3309}:3306"
    volumes:
      - local-db-data:/var/lib/mysql
      - ./sql/local-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./sql/local-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: travelmate_ai
      MYSQL_USER: travelmate_ai_app
      MYSQL_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "${AI_MYSQL_PORT:-3310}:3306"
    volumes:
      - ai-db-data:/var/lib/mysql
      - ./sql/ai-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./sql/ai-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  community-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: travelmate_community
      MYSQL_USER: travelmate_community_app
      MYSQL_PASSWORD: ${COMMUNITY_DB_PASSWORD}
    ports:
      - "${COMMUNITY_MYSQL_PORT:-3311}:3306"
    volumes:
      - community-db-data:/var/lib/mysql
      - ./sql/community-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./sql/community-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  ops-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: travelmate_ops
      MYSQL_USER: travelmate_ops_app
      MYSQL_PASSWORD: ${OPS_DB_PASSWORD}
    ports:
      - "${OPS_MYSQL_PORT:-3312}:3306"
    volumes:
      - ops-db-data:/var/lib/mysql
      - ./sql/ops-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./sql/ops-seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  identity-service:
    build: ./services/identity-service
    environment:
      DB_HOST: identity-db
      DB_NAME: travelmate_identity
      DB_USERNAME: travelmate_identity_app
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      ADMIN_REGISTER_SECRET: ${ADMIN_REGISTER_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100}
    ports:
      - "${IDENTITY_PORT:-8081}:8081"
    depends_on:
      identity-db:
        condition: service_healthy
      redis:
        condition: service_started

  traffic-service:
    build: ./services/traffic-service
    environment:
      DB_HOST: traffic-db
      DB_NAME: travelmate_traffic
      DB_USERNAME: travelmate_traffic_app
      DB_PASSWORD: ${TRAFFIC_DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100}
      OUTBOX_DISPATCHER_ENABLED: "true"
      AI_SERVICE_URL: http://ai-service:8084
      IDENTITY_SERVICE_URL: http://identity-service:8081
      LOCAL_SERVICE_URL: http://local-service:8083
    ports:
      - "${TRAFFIC_PORT:-8082}:8082"
    depends_on:
      traffic-db:
        condition: service_healthy
      redis:
        condition: service_started
      identity-service:
        condition: service_started
      local-service:
        condition: service_started
      ai-service:
        condition: service_started

  local-service:
    build: ./services/local-service
    environment:
      DB_HOST: local-db
      DB_NAME: travelmate_local
      DB_USERNAME: travelmate_local_app
      DB_PASSWORD: ${LOCAL_DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100}
      OUTBOX_DISPATCHER_ENABLED: "true"
      AI_SERVICE_URL: http://ai-service:8084
    ports:
      - "${LOCAL_PORT:-8083}:8083"
    depends_on:
      local-db:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_started

  ai-service:
    build: ./services/ai-service
    environment:
      DB_HOST: ai-db
      DB_NAME: travelmate_ai
      DB_USERNAME: travelmate_ai_app
      DB_PASSWORD: ${AI_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100}
    ports:
      - "${AI_PORT:-8084}:8084"
    depends_on:
      ai-db:
        condition: service_healthy

  community-service:
    build: ./services/community-service
    environment:
      DB_HOST: community-db
      DB_NAME: travelmate_community
      DB_USERNAME: travelmate_community_app
      DB_PASSWORD: ${COMMUNITY_DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      OPS_SERVICE_URL: http://ops-service:8086
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100}
    ports:
      - "${COMMUNITY_PORT:-8085}:8085"
    depends_on:
      community-db:
        condition: service_healthy
      redis:
        condition: service_started

  ops-service:
    build: ./services/ops-service
    environment:
      DB_HOST: ops-db
      DB_NAME: travelmate_ops
      DB_USERNAME: travelmate_ops_app
      DB_PASSWORD: ${OPS_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      TRAFFIC_SERVICE_URL: http://traffic-service:8082
      LOCAL_SERVICE_URL: http://local-service:8083
      COMMUNITY_SERVICE_URL: http://community-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100}
    ports:
      - "${OPS_PORT:-8086}:8086"
    depends_on:
      ops-db:
        condition: service_healthy

volumes:
  identity-db-data:
  traffic-db-data:
  local-db-data:
  ai-db-data:
  community-db-data:
  ops-db-data:
  redis-data:
