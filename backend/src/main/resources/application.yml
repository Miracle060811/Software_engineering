server:
  port: 8080

spring:
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/travelmate?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:sk-demo-placeholder}
    base-url: https://api.deepseek.com
