app:
  database:
    startup-validation:
      enabled: false
  scheduling:
    enabled: false

management:
  health:
    db:
      enabled: false
    redis:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,ping

spring:
  config:
    import: ""
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:travelmate-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
