server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:travelmate_identity}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
app:
  integration:
    mode: http
  services:
    community-url: ${COMMUNITY_SERVICE_URL:http://127.0.0.1:8085}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:14}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    admin-register-secret: ${ADMIN_REGISTER_SECRET:}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
