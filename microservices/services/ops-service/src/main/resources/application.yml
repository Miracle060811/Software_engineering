server:
  port: ${SERVER_PORT:8086}
spring:
  application.name: ops-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:travelmate_ops}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
app:
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security.jwt-secret: ${JWT_SECRET:}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  services:
    connect-timeout-ms: ${OPS_INTERNAL_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${OPS_INTERNAL_READ_TIMEOUT_MS:2000}
    identity-url: ${IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
    traffic-url: ${TRAFFIC_SERVICE_URL:http://127.0.0.1:8082}
    local-url: ${LOCAL_SERVICE_URL:http://127.0.0.1:8083}
    community-url: ${COMMUNITY_SERVICE_URL:http://127.0.0.1:8085}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
