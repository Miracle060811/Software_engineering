apiVersion: v1
kind: Service
metadata:
  name: identity-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: identity-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identity-db
spec:
  serviceName: identity-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-db
        app.kubernetes.io/part-of: travelmate
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: travelmate_identity
            - name: MYSQL_USER
              value: travelmate_identity_app
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelmate-microservices-secrets
                  key: mysql-root-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelmate-microservices-secrets
                  key: identity-db-password
          startupProbe: &mysqlProbe
            exec:
              command: ["sh", "-ec", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe: *mysqlProbe
          livenessProbe:
            <<: *mysqlProbe
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: identity-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
