apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app.kubernetes.io/name: ai-service
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: travelmate
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-service
          image: travelmate/ai-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: travelmate-microservices-config
          env:
            - name: DB_HOST
              value: ai-db
            - name: DB_NAME
              value: travelmate_ai
            - name: DB_USERNAME
              value: travelmate_ai_app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelmate-microservices-secrets
                  key: ai-db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: travelmate-microservices-secrets
                  key: jwt-secret
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: travelmate-microservices-secrets
                  key: internal-service-token
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: travelmate-microservices-secrets
                  key: deepseek-api-key
                  optional: true
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          startupProbe: &aiProbe
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            <<: *aiProbe
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
