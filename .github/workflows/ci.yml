name: TravelMate CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes that require build and tests
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE_SHA"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(backend/|frontend/|deploy/|docs/sql/|scripts/|package(-lock)?\.json$|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  validation:
    name: Repository and use-case validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Reject tracked generated artifacts
        shell: bash
        run: |
          tracked="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$tracked" ]]; then
            echo "The following ignored build artifacts are still tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Validate UC01-UC19 traceability
        env:
          TRACEABILITY_REPORT: 04_tests/reports/ci/use-case-traceability.md
        run: npm run check:traceability

      - name: Validate database migrations and Kubernetes manifests
        run: npm run check:deployment

      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s > /tmp/travelmate-k8s.yaml

      - name: Validate deployment PowerShell syntax
        shell: pwsh
        run: |
          $hasErrors = $false
          Get-ChildItem scripts/cd -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $hasErrors = $true
              Write-Error "$($_.Name): $($errors.Message -join '; ')"
            }
          }
          if ($hasErrors) { exit 1 }

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: use-case-traceability-report
          path: 04_tests/reports/ci/use-case-traceability.md
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Backend integration tests and package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: travelmate-ci
          MYSQL_DATABASE: travelmate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptravelmate-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_PASSWORD: travelmate-ci
      JWT_SECRET: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      DEEPSEEK_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests and package
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify -DskipITs

      - name: Run MySQL integration tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/travelmate?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: travelmate-ci
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: "6379"
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress failsafe:integration-test failsafe:verify -Dspring.profiles.active=mysql-test

      - name: Verify Flyway initialized the empty database
        shell: bash
        run: |
          applied="$(docker exec ${{ job.services.mysql.id }} mysql -N -uroot -ptravelmate-ci travelmate -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1;")"
          latest="$(docker exec ${{ job.services.mysql.id }} mysql -N -uroot -ptravelmate-ci travelmate -e "SELECT MAX(CAST(version AS UNSIGNED)) FROM flyway_schema_history WHERE success = 1;")"
          echo "Successful Flyway migrations: $applied; latest version: $latest"
          [[ "$applied" -ge 2 ]]
          [[ "$latest" == "2" ]]

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
            backend/target/spotbugsXml.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload backend package
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-package
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend build and mocked smoke E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend source
        working-directory: frontend
        run: npm run lint

      - name: Audit production dependencies
        working-directory: frontend
        run: npm run audit:prod

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=list,html --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  real-e2e:
    name: Real backend E2E
    needs:
      - changes
      - validation
      - backend
      - frontend
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.validation.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: travelmate-ci
          MYSQL_DATABASE: travelmate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptravelmate-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: "true"
      SPRING_DATASOURCE_PASSWORD: travelmate-ci
      JWT_SECRET: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      ADMIN_REGISTER_SECRET: travelmate-ci-admin-register
      DEEPSEEK_API_KEY: ""
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download tested backend package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-package
          path: ci-artifacts/backend

      - name: Start tested backend package
        shell: bash
        run: |
          java -jar ci-artifacts/backend/*.jar > backend-ci.log 2>&1 &
          echo $! > backend-ci.pid
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:8080/actuator/health" > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          cat backend-ci.log
          exit 1

      - name: Verify packaged backend applied Flyway migrations
        shell: bash
        run: |
          latest="$(docker exec ${{ job.services.mysql.id }} mysql -N -uroot -ptravelmate-ci travelmate -e "SELECT MAX(CAST(version AS UNSIGNED)) FROM flyway_schema_history WHERE success = 1;")"
          echo "Latest Flyway version after packaged startup: $latest"
          [[ "$latest" == "2" ]]

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real backend E2E tests
        working-directory: frontend
        run: npx playwright test --config=playwright.real.config.js --workers=1

      - name: Upload real E2E report and backend log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-backend-e2e-evidence
          path: |
            frontend/playwright-report-real/
            frontend/test-results-real/
            backend-ci.log
          if-no-files-found: warn
          retention-days: 30

  ci-gate:
    name: CI quality gate
    if: always()
    needs:
      - changes
      - validation
      - backend
      - frontend
      - real-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI stage to pass
        shell: bash
        run: |
          echo "validation=${{ needs.validation.result }}"
          echo "changes=${{ needs.changes.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "real-e2e=${{ needs.real-e2e.result }}"
          [[ "${{ needs.changes.result }}" == "success" ]]
          [[ "${{ needs.validation.result }}" == "success" ]]

          code="${{ needs.changes.outputs.code }}"
          if [[ "$code" == "true" ]]; then
            [[ "${{ needs.backend.result }}" == "success" ]]
            [[ "${{ needs.frontend.result }}" == "success" ]]
          else
            [[ "${{ needs.backend.result }}" == "skipped" ]]
            [[ "${{ needs.frontend.result }}" == "skipped" ]]
          fi

          real_required=false
          if [[ "$code" == "true" ]] && { [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; }; then
            real_required=true
          fi
          if [[ "$real_required" == "true" ]]; then
            [[ "${{ needs.real-e2e.result }}" == "success" ]]
          else
            [[ "${{ needs.real-e2e.result }}" == "skipped" ]]
          fi
