name: Publish TravelMate images

on:
  workflow_run:
    workflows:
      - TravelMate CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  checks: read
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/miracle060811/travelmate-backend
  FRONTEND_IMAGE: ghcr.io/miracle060811/travelmate-frontend

jobs:
  publish:
    name: Publish commit images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm this run still represents releasable main code
        id: eligibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current_main" != "$RELEASE_SHA" ]]; then
            echo "Commit $RELEASE_SHA is no longer the tip of main; leaving the deployment channel unchanged."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          backend_count="$(jq '[.artifacts[] | select(.name == "backend-package" and .expired == false)] | length' <<<"$artifacts")"
          frontend_count="$(jq '[.artifacts[] | select(.name == "frontend-dist" and .expired == false)] | length' <<<"$artifacts")"
          if [[ "$backend_count" -ne 1 || "$frontend_count" -ne 1 ]]; then
            echo "The CI run contains no releasable backend/frontend artifacts; treating it as a non-code change."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Require every gate for the same commit
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          required=(
            "CI quality gate"
            "CodeQL quality gate"
            "Secret scan"
            "Maven dependency audit"
            "Node.js dependency audit"
          )

          for attempt in {1..80}; do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100")"
            all_success=true
            for check_name in "${required[@]}"; do
              check="$(jq -c --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at // .created_at)
                | last // empty
              ' <<<"$payload")"
              if [[ -z "$check" ]]; then
                echo "$check_name: not created yet"
                all_success=false
                continue
              fi

              status="$(jq -r .status <<<"$check")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$check")"
              echo "$check_name: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                echo "Required check failed: $check_name ($conclusion)"
                exit 1
              fi
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_success=false
              fi
            done

            if [[ "$all_success" == "true" ]]; then
              exit 0
            fi
            sleep 15
          done

          echo "Timed out waiting for required checks on $RELEASE_SHA"
          exit 1

      - name: Download tested backend package
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-package
          path: backend/target
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download tested frontend build
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate tested artifacts
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' jars < <(find backend/target -maxdepth 1 -type f -name '*.jar' -print0)
          [[ "${#jars[@]}" -eq 1 ]]
          test -s frontend/dist/index.html

      - name: Log in to GHCR
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push immutable commit images
        if: steps.eligibility.outputs.eligible == 'true'
        id: build
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          image_tag="sha-$RELEASE_SHA"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          docker build --pull \
            --build-arg "GIT_SHA=$RELEASE_SHA" \
            --build-arg "BUILD_DATE=$build_date" \
            --build-arg "IMAGE_VERSION=$image_tag" \
            --tag "$BACKEND_IMAGE:$image_tag" \
            backend
          docker build --pull \
            --build-arg "GIT_SHA=$RELEASE_SHA" \
            --build-arg "BUILD_DATE=$build_date" \
            --build-arg "IMAGE_VERSION=$image_tag" \
            --tag "$FRONTEND_IMAGE:$image_tag" \
            frontend

          docker push "$BACKEND_IMAGE:$image_tag"
          docker push "$FRONTEND_IMAGE:$image_tag"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Scan backend image
        if: steps.eligibility.outputs.eligible == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.build.outputs.image_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-backend-image.json

      - name: Scan frontend image
        if: steps.eligibility.outputs.eligible == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.build.outputs.image_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-frontend-image.json

      - name: Promote the matching image pair to the deployment channel
        if: steps.eligibility.outputs.eligible == 'true'
        id: promote
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          image_tag="${{ steps.build.outputs.image_tag }}"
          backend_sha="$BACKEND_IMAGE:$image_tag"
          frontend_sha="$FRONTEND_IMAGE:$image_tag"

          docker tag "$backend_sha" "$BACKEND_IMAGE:main"
          docker tag "$frontend_sha" "$FRONTEND_IMAGE:main"
          docker push "$BACKEND_IMAGE:main"
          docker push "$FRONTEND_IMAGE:main"

          docker tag "$backend_sha" "$BACKEND_IMAGE:deploy"
          docker push "$BACKEND_IMAGE:deploy"
          docker tag "$frontend_sha" "$FRONTEND_IMAGE:deploy"
          docker push "$FRONTEND_IMAGE:deploy"

          backend_digest="$(docker image inspect "$backend_sha" --format '{{json .RepoDigests}}' \
            | jq -r --arg prefix "$BACKEND_IMAGE@sha256:" '.[] | select(startswith($prefix))' \
            | head -n1)"
          frontend_digest="$(docker image inspect "$frontend_sha" --format '{{json .RepoDigests}}' \
            | jq -r --arg prefix "$FRONTEND_IMAGE@sha256:" '.[] | select(startswith($prefix))' \
            | head -n1)"
          test -n "$backend_digest"
          test -n "$frontend_digest"

          jq -n \
            --arg commit "$RELEASE_SHA" \
            --arg source_run "${{ github.event.workflow_run.id }}" \
            --arg backend "$backend_digest" \
            --arg frontend "$frontend_digest" \
            '{commit:$commit,source_run_id:$source_run,backend:$backend,frontend:$frontend}' \
            > deployment-release.json

      - name: Upload image scan and release evidence
        if: always() && steps.eligibility.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-release-${{ github.event.workflow_run.head_sha }}
          path: |
            deployment-release.json
            trivy-backend-image.json
            trivy-frontend-image.json
          if-no-files-found: warn
          retention-days: 30
