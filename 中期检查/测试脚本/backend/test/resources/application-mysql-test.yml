app:
  security:
    jwt-secret: ${JWT_SECRET:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
  database:
    startup-validation:
      enabled: false
  scheduling:
    enabled: false

management:
  health:
    db:
      enabled: false
    redis:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,ping

spring:
  config:
    import: ""
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/travelmate?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:travelmate-ci}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

ai:
  place-verification:
    enabled: false
  weather:
    enabled: false
  deepseek:
    api-key: ""