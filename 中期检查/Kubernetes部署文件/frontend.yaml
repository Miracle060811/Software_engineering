apiVersion: v1
kind: Service
metadata:
  name: travelmate-frontend
  labels:
    app.kubernetes.io/name: travelmate-frontend
    app.kubernetes.io/part-of: travelmate
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: travelmate-frontend
  ports:
    - name: http
      port: 30080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelmate-frontend
  labels:
    app.kubernetes.io/name: travelmate-frontend
    app.kubernetes.io/part-of: travelmate
  annotations:
    travelmate.io/commit: bootstrap
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travelmate-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: travelmate-frontend
        app.kubernetes.io/part-of: travelmate
    spec:
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: travelmate-ghcr
      containers:
        - name: frontend
          image: ghcr.io/miracle060811/travelmate-frontend:deploy
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
