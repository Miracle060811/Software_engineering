apiVersion: v1
kind: ConfigMap
metadata:
  name: travelmate-config
data:
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: jdbc:mysql://travelmate-mysql:3306/travelmate?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
  SPRING_DATASOURCE_USERNAME: travelmate
  SPRING_DATA_REDIS_HOST: travelmate-redis
  SPRING_DATA_REDIS_PORT: "6379"
  UPLOAD_DIR: /app/uploads
  CORS_ALLOWED_ORIGINS: http://localhost:30080,http://127.0.0.1:30080
  MYBATIS_LOG_IMPL: org.apache.ibatis.logging.nologging.NoLoggingImpl
  AI_PLACE_VERIFICATION_USER_AGENT: TravelMate/1.0 (https://github.com/Miracle060811/Software_engineering)
