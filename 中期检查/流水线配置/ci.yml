name: TravelMate CI/CD

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes that require build and tests
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE_SHA"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq '^(backend/|frontend/|microservices/|deploy/|docs/sql/|scripts/|package(-lock)?\.json$|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  validation:
    name: Repository and use-case validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Reject tracked generated artifacts
        shell: bash
        run: |
          tracked="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$tracked" ]]; then
            echo "The following ignored build artifacts are still tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Validate UC01-UC19 traceability
        env:
          TRACEABILITY_REPORT: 04_tests/reports/ci/use-case-traceability.md
        run: npm run check:traceability

      - name: Validate database migrations and Kubernetes manifests
        run: npm run check:deployment

      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s > /tmp/travelmate-k8s.yaml

      - name: Validate deployment PowerShell syntax
        shell: pwsh
        run: |
          $hasErrors = $false
          Get-ChildItem scripts/cd -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $hasErrors = $true
              Write-Error "$($_.Name): $($errors.Message -join '; ')"
            }
          }
          if ($hasErrors) { exit 1 }

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: use-case-traceability-report
          path: 04_tests/reports/ci/use-case-traceability.md
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Backend integration tests and package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: travelmate-ci
          MYSQL_DATABASE: travelmate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptravelmate-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_PASSWORD: travelmate-ci
      JWT_SECRET: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      DEEPSEEK_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests and package
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify -DskipITs

      - name: Run MySQL integration tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/travelmate?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: travelmate-ci
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: "6379"
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress failsafe:integration-test failsafe:verify -Dspring.profiles.active=mysql-test

      - name: Start packaged backend against empty MySQL
        shell: bash
        run: |
          java -jar backend/target/*.jar > backend-flyway-ci.log 2>&1 &
          echo $! > backend-flyway-ci.pid
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:8080/actuator/health" > /dev/null; then
              echo "Backend is ready after applying Flyway migrations"
              exit 0
            fi
            sleep 2
          done
          cat backend-flyway-ci.log
          exit 1

      - name: Verify Flyway initialized the empty database
        shell: bash
        run: |
          applied="$(docker exec ${{ job.services.mysql.id }} mysql -N -uroot -ptravelmate-ci travelmate -e "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 1;")"
          latest="$(docker exec ${{ job.services.mysql.id }} mysql -N -uroot -ptravelmate-ci travelmate -e "SELECT MAX(CAST(version AS UNSIGNED)) FROM flyway_schema_history WHERE success = 1;")"
          echo "Successful Flyway migrations: $applied; latest version: $latest"
          [[ "$applied" -ge 2 ]]
          [[ "$latest" == "2" ]]

      - name: Stop Flyway verification backend
        if: always()
        shell: bash
        run: |
          if [[ -f backend-flyway-ci.pid ]]; then
            kill "$(cat backend-flyway-ci.pid)" 2>/dev/null || true
          fi

      - name: Upload Flyway startup log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-flyway-startup-log
          path: backend-flyway-ci.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
            backend/target/spotbugsXml.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload backend package
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-package
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 14

  microservices:
    name: Microservices build and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            microservices/**/pom.xml

      - name: Run microservices tests and package
        working-directory: microservices
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload microservices test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microservices-test-reports
          path: |
            microservices/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend build and mocked smoke E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend source
        working-directory: frontend
        run: npm run lint

      - name: Audit production dependencies
        working-directory: frontend
        run: npm run audit:prod

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=list,html --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  real-e2e:
    name: Real backend E2E
    needs:
      - changes
      - validation
      - backend
      - frontend
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.validation.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: travelmate-ci
          MYSQL_DATABASE: travelmate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptravelmate-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: "true"
      SPRING_DATASOURCE_PASSWORD: travelmate-ci
      JWT_SECRET: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      ADMIN_REGISTER_SECRET: travelmate-ci-admin-register
      DEEPSEEK_API_KEY: ""
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download tested backend package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-package
          path: ci-artifacts/backend

      - name: Start tested backend package
        shell: bash
        run: |
          java -jar ci-artifacts/backend/*.jar > backend-ci.log 2>&1 &
          echo $! > backend-ci.pid
          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:8080/actuator/health" > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          cat backend-ci.log
          exit 1

      - name: Verify packaged backend applied Flyway migrations
        shell: bash
        run: |
          latest="$(docker exec ${{ job.services.mysql.id }} mysql -N -uroot -ptravelmate-ci travelmate -e "SELECT MAX(CAST(version AS UNSIGNED)) FROM flyway_schema_history WHERE success = 1;")"
          echo "Latest Flyway version after packaged startup: $latest"
          [[ "$latest" == "2" ]]

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real backend E2E tests
        working-directory: frontend
        run: npx playwright test --config=playwright.real.config.js --workers=1

      - name: Upload real E2E report and backend log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-backend-e2e-evidence
          path: |
            frontend/playwright-report-real/
            frontend/test-results-real/
            backend-ci.log
          if-no-files-found: warn
          retention-days: 30

  ci-gate:
    name: CI quality gate
    if: always()
    needs:
      - changes
      - validation
      - backend
      - microservices
      - frontend
      - real-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI stage to pass
        shell: bash
        run: |
          echo "validation=${{ needs.validation.result }}"
          echo "changes=${{ needs.changes.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "microservices=${{ needs.microservices.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "real-e2e=${{ needs.real-e2e.result }}"
          [[ "${{ needs.changes.result }}" == "success" ]]
          [[ "${{ needs.validation.result }}" == "success" ]]

          code="${{ needs.changes.outputs.code }}"
          if [[ "$code" == "true" ]]; then
            [[ "${{ needs.backend.result }}" == "success" ]]
            [[ "${{ needs.microservices.result }}" == "success" ]]
            [[ "${{ needs.frontend.result }}" == "success" ]]
          else
            [[ "${{ needs.backend.result }}" == "skipped" ]]
            [[ "${{ needs.microservices.result }}" == "skipped" ]]
            [[ "${{ needs.frontend.result }}" == "skipped" ]]
          fi

          real_required=false
          if [[ "$code" == "true" ]] && { [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; }; then
            real_required=true
          fi
          if [[ "$real_required" == "true" ]]; then
            [[ "${{ needs.real-e2e.result }}" == "success" ]]
          else
            [[ "${{ needs.real-e2e.result }}" == "skipped" ]]
          fi

  images:
    name: Build and publish deployment images
    needs:
      - changes
      - ci-gate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.ci-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.release.outputs.backend_digest }}
      frontend_digest: ${{ steps.release.outputs.frontend_digest }}

    env:
      BACKEND_IMAGE: ghcr.io/miracle060811/travelmate-backend
      FRONTEND_IMAGE: ghcr.io/miracle060811/travelmate-frontend

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require security gates for the same commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required=(
            "CodeQL quality gate"
            "Secret scan"
            "Maven dependency audit"
            "Node.js dependency audit"
          )

          for attempt in {1..80}; do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100")"
            all_success=true
            for check_name in "${required[@]}"; do
              check="$(jq -c --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at // .created_at)
                | last // empty
              ' <<<"$payload")"
              if [[ -z "$check" ]]; then
                echo "$check_name: not created yet"
                all_success=false
                continue
              fi

              status="$(jq -r .status <<<"$check")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$check")"
              echo "$check_name: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                echo "Required check failed: $check_name ($conclusion)"
                exit 1
              fi
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_success=false
              fi
            done

            if [[ "$all_success" == "true" ]]; then
              exit 0
            fi
            sleep 15
          done

          echo "Timed out waiting for security checks on $RELEASE_SHA"
          exit 1

      - name: Download tested backend package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-package
          path: backend/target

      - name: Download tested frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Validate tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' jars < <(find backend/target -maxdepth 1 -type f -name '*.jar' -print0)
          [[ "${#jars[@]}" -eq 1 ]]
          test -s frontend/dist/index.html

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push immutable commit images
        id: build
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_tag="sha-$RELEASE_SHA"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          docker build --pull \
            --build-arg "GIT_SHA=$RELEASE_SHA" \
            --build-arg "BUILD_DATE=$build_date" \
            --build-arg "IMAGE_VERSION=$image_tag" \
            --tag "$BACKEND_IMAGE:$image_tag" \
            backend
          docker build --pull \
            --build-arg "GIT_SHA=$RELEASE_SHA" \
            --build-arg "BUILD_DATE=$build_date" \
            --build-arg "IMAGE_VERSION=$image_tag" \
            --tag "$FRONTEND_IMAGE:$image_tag" \
            frontend

          docker push "$BACKEND_IMAGE:$image_tag"
          docker push "$FRONTEND_IMAGE:$image_tag"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.build.outputs.image_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-backend-image.json

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.build.outputs.image_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-frontend-image.json

      - name: Promote image pair and record digests
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_tag="${{ steps.build.outputs.image_tag }}"
          backend_sha="$BACKEND_IMAGE:$image_tag"
          frontend_sha="$FRONTEND_IMAGE:$image_tag"

          for channel in main deploy; do
            docker tag "$backend_sha" "$BACKEND_IMAGE:$channel"
            docker tag "$frontend_sha" "$FRONTEND_IMAGE:$channel"
            docker push "$BACKEND_IMAGE:$channel"
            docker push "$FRONTEND_IMAGE:$channel"
          done

          backend_digest="$(docker image inspect "$backend_sha" --format '{{json .RepoDigests}}' \
            | jq -r --arg prefix "$BACKEND_IMAGE@sha256:" '.[] | select(startswith($prefix))' \
            | head -n1)"
          frontend_digest="$(docker image inspect "$frontend_sha" --format '{{json .RepoDigests}}' \
            | jq -r --arg prefix "$FRONTEND_IMAGE@sha256:" '.[] | select(startswith($prefix))' \
            | head -n1)"
          test -n "$backend_digest"
          test -n "$frontend_digest"
          echo "backend_digest=$backend_digest" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$frontend_digest" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg commit "$RELEASE_SHA" \
            --arg source_run "${{ github.run_id }}" \
            --arg backend "$backend_digest" \
            --arg frontend "$frontend_digest" \
            '{commit:$commit,source_run_id:$source_run,backend:$backend,frontend:$frontend}' \
            > deployment-release.json

      - name: Upload image scan and release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-release-${{ github.sha }}
          path: |
            deployment-release.json
            trivy-backend-image.json
            trivy-frontend-image.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Deploy to Docker Desktop Kubernetes
    needs:
      - changes
      - images
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.images.result == 'success'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - travelmate-deploy
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout released commit over HTTPS
        timeout-minutes: 5
        shell: powershell
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDirectory = Join-Path $env:RUNNER_TEMP "travelmate-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          [System.IO.Directory]::CreateDirectory($sourceDirectory) | Out-Null

          git -C $sourceDirectory init
          if ($LASTEXITCODE -ne 0) { throw "Unable to initialize the deployment source directory" }

          git -C $sourceDirectory remote add origin "https://github.com/Miracle060811/Software_engineering.git"
          if ($LASTEXITCODE -ne 0) { throw "Unable to configure the deployment repository" }

          $fetched = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Output "Fetching released commit over HTTPS: attempt $attempt/3"
            git -C $sourceDirectory `
              -c http.version=HTTP/1.1 `
              -c http.lowSpeedLimit=1024 `
              -c http.lowSpeedTime=30 `
              fetch --depth=1 origin $env:RELEASE_SHA
            if ($LASTEXITCODE -eq 0) {
              $fetched = $true
              break
            }

            if ($attempt -lt 3) {
              Start-Sleep -Seconds 10
            }
          }
          if (-not $fetched) { throw "Unable to fetch released commit $env:RELEASE_SHA over HTTPS after 3 attempts" }

          git -C $sourceDirectory checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to check out released commit $env:RELEASE_SHA" }

          $checkedOutSha = (git -C $sourceDirectory rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOutSha -ne $env:RELEASE_SHA) {
            throw "Deployment source SHA mismatch: expected $env:RELEASE_SHA, got $checkedOutSha"
          }

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "TRAVELMATE_SOURCE=$sourceDirectory`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Verify deployment host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ((kubectl config current-context) -ne "docker-desktop") {
            throw "The self-hosted runner is not using the docker-desktop Kubernetes context"
          }
          docker info --format "Docker Server {{.ServerVersion}}" | Write-Output
          kubectl get nodes

      - name: Deploy immutable image pair with rollback
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & (Join-Path $env:TRAVELMATE_SOURCE "scripts\cd\Deploy-TravelMate.ps1") -KubeContext docker-desktop

      - name: Verify deployed digests and health
        shell: powershell
        env:
          EXPECTED_BACKEND_IMAGE: ${{ needs.images.outputs.backend_digest }}
          EXPECTED_FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_digest }}
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "travelmate-deployment-evidence"
          [IO.Directory]::CreateDirectory($evidenceDirectory) | Out-Null

          $backendImage = (& kubectl get deployment travelmate-backend -n travelmate -o "jsonpath={.spec.template.spec.containers[0].image}").Trim()
          $frontendImage = (& kubectl get deployment travelmate-frontend -n travelmate -o "jsonpath={.spec.template.spec.containers[0].image}").Trim()
          if ($backendImage -ne $env:EXPECTED_BACKEND_IMAGE) {
            throw "Backend digest mismatch: expected $env:EXPECTED_BACKEND_IMAGE, found $backendImage"
          }
          if ($frontendImage -ne $env:EXPECTED_FRONTEND_IMAGE) {
            throw "Frontend digest mismatch: expected $env:EXPECTED_FRONTEND_IMAGE, found $frontendImage"
          }

          $frontendHealth = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:30080/healthz" -TimeoutSec 15
          if ($frontendHealth.StatusCode -ne 200) {
            throw "Frontend health check failed with HTTP $($frontendHealth.StatusCode)"
          }

          $forwardOut = Join-Path $evidenceDirectory "backend-port-forward.out.log"
          $forwardErr = Join-Path $evidenceDirectory "backend-port-forward.err.log"
          $portForward = Start-Process -FilePath "kubectl" `
            -ArgumentList @("port-forward", "service/travelmate-backend", "18080:8080", "-n", "travelmate") `
            -WindowStyle Hidden `
            -RedirectStandardOutput $forwardOut `
            -RedirectStandardError $forwardErr `
            -PassThru
          try {
            $backendHealth = $null
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                $backendHealth = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/actuator/health/readiness" -TimeoutSec 5
                if ($backendHealth.StatusCode -eq 200) { break }
              }
              catch {
                Start-Sleep -Seconds 2
              }
            }
            if ($null -eq $backendHealth -or $backendHealth.StatusCode -ne 200) {
              throw "Backend readiness endpoint did not return HTTP 200"
            }
          }
          finally {
            if (-not $portForward.HasExited) {
              Stop-Process -Id $portForward.Id -Force
            }
          }

          kubectl get pods,services,pvc -n travelmate -o wide | Set-Content -LiteralPath (Join-Path $evidenceDirectory "kubernetes-status.txt") -Encoding utf8
          kubectl get deployment,statefulset -n travelmate -o json | Set-Content -LiteralPath (Join-Path $evidenceDirectory "workloads.json") -Encoding utf8
          kubectl get pods -n travelmate -o json | Set-Content -LiteralPath (Join-Path $evidenceDirectory "pods.json") -Encoding utf8
          @(
            "commit=${{ github.sha }}"
            "backend=$backendImage"
            "frontend=$frontendImage"
            "frontend_health=$($frontendHealth.StatusCode)"
            "backend_health=$($backendHealth.StatusCode)"
          ) | Set-Content -LiteralPath (Join-Path $evidenceDirectory "deployment-summary.txt") -Encoding utf8

      - name: Capture deployment state and logs
        if: always()
        shell: powershell
        run: |
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "travelmate-deployment-evidence"
          [IO.Directory]::CreateDirectory($evidenceDirectory) | Out-Null
          kubectl get pods,services,pvc -n travelmate -o wide 2>&1 | Set-Content -LiteralPath (Join-Path $evidenceDirectory "kubernetes-status-final.txt") -Encoding utf8
          kubectl get events -n travelmate --sort-by=.lastTimestamp 2>&1 | Set-Content -LiteralPath (Join-Path $evidenceDirectory "kubernetes-events.txt") -Encoding utf8
          $deployLog = Join-Path $env:USERPROFILE "TravelMateCD\deploy.log"
          if (Test-Path -LiteralPath $deployLog -PathType Leaf) {
            Copy-Item -LiteralPath $deployLog -Destination (Join-Path $evidenceDirectory "deploy.log") -Force
          }

      - name: Upload Kubernetes deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubernetes-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/travelmate-deployment-evidence/
          if-no-files-found: warn
          retention-days: 30

  delivery-gate:
    name: CI/CD delivery gate
    if: always()
    needs:
      - changes
      - images
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require delivery stages for main code pushes
        shell: bash
        run: |
          set -euo pipefail
          delivery_required=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" && "${{ needs.changes.outputs.code }}" == "true" ]]; then
            delivery_required=true
          fi

          echo "delivery_required=$delivery_required"
          echo "images=${{ needs.images.result }}"
          echo "deploy=${{ needs.deploy.result }}"
          if [[ "$delivery_required" == "true" ]]; then
            [[ "${{ needs.images.result }}" == "success" ]]
            [[ "${{ needs.deploy.result }}" == "success" ]]
          else
            [[ "${{ needs.images.result }}" == "skipped" ]]
            [[ "${{ needs.deploy.result }}" == "skipped" ]]
          fi
